    const careerList = document.getElementById("career-list");

    function renderCareers(filter = "") {
      careerList.innerHTML = "";
      const filtered = careers.filter(career => 
        career.title.toLowerCase().includes(filter.toLowerCase())
      );
      if (filtered.length === 0) {
        careerList.innerHTML = `<p class="col-span-3 text-center text-gray-600">No careers found.</p>`;
        return;
      }
      filtered.forEach((career, index) => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-lg p-6 cursor-pointer hover:shadow-xl transition";
        card.innerHTML = `<h3 class="text-xl font-semibold mb-2">${career.title}</h3>
                          <p class="text-gray-600">Click to learn more →</p>`;
        card.onclick = () => openModal(careers.indexOf(career));
        careerList.appendChild(card);
      });
    }

    function openModal(index) {
      const career = careers[index];
      document.getElementById("modalTitle").innerText = career.title;
      document.getElementById("modalJob").innerText = career.job;
      document.getElementById("modalSalary").innerText = career.salary;
      document.getElementById("modalDemand").innerText = career.demand;
      document.getElementById("careerModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("careerModal").classList.add("hidden");
    }

    document.getElementById("searchBar").addEventListener("input", (e) => {
      renderCareers(e.target.value);
    });
