<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ===== Global Styling ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .auth-container {
            width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .auth-container h2 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        form {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        form.active {
            display: flex;
        }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 5px rgba(42, 82, 152, 0.4);
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .toggle-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .toggle-text span {
            color: #2a5298;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .success {
            color: #0aaf60;
        }

        .error {
            color: #e63946;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h2>Welcome Back 👋</h2>
        <p class="subtitle">Already have an account? Log in. New here? Create an account.</p>

        <!-- Login Form (Default) -->
        <form id="loginForm" class="active">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
            <div class="message" id="loginMessage"></div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm">
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button type="submit">Create Account</button>
            <div class="message" id="signupMessage"></div>
        </form>

        <!-- Toggle -->
        <p class="toggle-text" id="toggleText">
            New user? <span id="showSignup">Create Account</span>
        </p>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const toggleText = document.getElementById("toggleText");
        const showSignup = document.getElementById("showSignup");

        let isLogin = true;

        // Toggle between login & signup
        toggleText.addEventListener("click", () => {
            if (isLogin) {
                loginForm.classList.remove("active");
                signupForm.classList.add("active");
                toggleText.innerHTML = `Already have an account? <span>Login</span>`;
            } else {
                signupForm.classList.remove("active");
                loginForm.classList.add("active");
                toggleText.innerHTML = `New user? <span>Create Account</span>`;
            }
            isLogin = !isLogin;
        });

        // Signup
        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("signupName").value;
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            try {
                const res = await fetch("https://garvautomation.app.n8n.cloud/webhook/garvautomationsignup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.text();
                document.getElementById("signupMessage").textContent = data;
                document.getElementById("signupMessage").className = "message success";
                // ✅ Clear fields after submit
                document.getElementById("signupName").value = "";
                document.getElementById("signupEmail").value = "";
                document.getElementById("signupPassword").value = "";

                setTimeout(() => {
                    signupForm.classList.remove("active");
                    loginForm.classList.add("active");
                    toggleText.innerHTML = `Already have an account? <span>Login</span>`;
                    isLogin = true;

                    // ✅ Show success message on login form
                    document.getElementById("loginMessage").textContent = "Your account created successfully ✅ Please login now.";
                    document.getElementById("loginMessage").className = "message success";

                    // Clear signup message
                    document.getElementById("signupMessage").textContent = "";
                })
            } catch {
                document.getElementById("signupMessage").textContent = "Error creating account!";
                document.getElementById("signupMessage").className = "message error";
            }
        });

        // Login
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch("https://garvautomation.app.n8n.cloud/webhook/garvautomationlogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.status === "success") {
                    document.getElementById("loginMessage").textContent = data.message;
                    document.getElementById("loginMessage").className = "message success";
                    // ✅ Clear fields after submit
                    // document.getElementById("loginEmail").value = "";
                    // document.getElementById("loginPassword").value = "";
                    setTimeout(() => {
                        window.location.href = "home.html";
                    });
                } else {
                    document.getElementById("loginMessage").textContent = data.message || "invalid login!";
                    document.getElementById("loginMessage").className = "message error";

                }
            } catch {
                document.getElementById("loginMessage").textContent = "Login error!";
                document.getElementById("loginMessage").className = "message error";
            }
        });
    </script>

</body>

</html>
